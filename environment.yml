name: onomasia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Runtime
  - jsonschema             # validation of records against their schemas
  - pyyaml                 # records and configuration
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned as pyproject.toml pins them; pip installs a Git reference, which a
  # conda dependency cannot name.
  - pip
  - pip:
      - anagraphe @ git+https://github.com/esther-poniatowski/anagraphe.git@b82bcae928570edf71d88ce8c316796a4333f0c5
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32
variables:
