name: onomasia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Runtime
  - jsonschema             # validation of records against their schemas
  - pyyaml                 # records and configuration
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned as pyproject.toml pins them; pip installs a Git reference, which a
  # conda dependency cannot name.
  - pip
  - pip:
      - anagraphe @ git+https://github.com/esther-poniatowski/anagraphe.git@37b4fa469482e0af95a4db84c7158ac19656b16e
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@506c2a1662620b5d29d4471117799ea1ef6d330f
variables:
