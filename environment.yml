name: onomasia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - types-pyyaml           # type stubs of PyYAML, for mypy
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Runtime
  - jsonschema             # validation of records against their schemas
  - pyyaml                 # records and configuration
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned as pyproject.toml pins them; pip installs a Git reference, which a
  # conda dependency cannot name.
  - pip
  - pip:
      - anagraphe-read @ git+https://github.com/esther-poniatowski/anagraphe.git@cb0ffc685d0ccc58b67ddb8f08936d750de5f7f2#subdirectory=packages/read-python
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@74267731c172676ace9cee9ea224d74d118b1f32
      # The tests check the findings log with the profile interface of Elenchos.
      - elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@4141cc82978a8e1ebba23b9c92af71691cffe954
variables:
