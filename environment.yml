name: onomasia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Runtime
  - jsonschema             # validation of records against their schemas
  - pyyaml                 # records and configuration
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned as pyproject.toml pins them; pip installs a Git reference, which a
  # conda dependency cannot name.
  - pip
  - pip:
      - anagraphe @ git+https://github.com/esther-poniatowski/anagraphe.git@97a5850c2298bb3000e9f52c6426d75da7826037
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@feb6654e0f821d076798a81fa062639a4bd0affd
variables:
