name: onomasia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Runtime
  - jsonschema             # validation of records against their schemas
  - pyyaml                 # records and configuration
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned as pyproject.toml pins them; pip installs a Git reference, which a
  # conda dependency cannot name.
  - pip
  - pip:
      - anagraphe @ git+https://github.com/esther-poniatowski/anagraphe.git@de023eb30d0179ae19b1b433fcdab6eacc6bf116
      - merismos @ git+https://github.com/esther-poniatowski/merismos.git@85e62c1cd15f24aa2def25c119d5aae040e993c0
variables:
