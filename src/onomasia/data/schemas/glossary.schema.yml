# Format of a glossary, onomasia:glossary@2: the admitted terms of a vocabulary, and the lexical
# rules that forbid other forms, each rule possibly scoped to audiences. An import names its source
# by an identifier, or by a logical target into another repository. The file
# glossary.v1.schema.yml keeps onomasia:glossary@1, which Onomasia still reads.
$schema: https://json-schema.org/draft/2020-12/schema
$id: glossary.schema.yml
title: Glossary
type: object
additionalProperties: false
# The identifier of the record, which a logical target of Anagraphe names.
x-identifier: id
required: [_schema, id]
properties:
  _schema: {const: 'onomasia:glossary@2'}
  id: {$ref: 'common.schema.yml#/$defs/id'}
  imports:
    type: array
    items:
      $ref: 'common.schema.yml#/$defs/import-v2'
      # The record named by a target follows a glossary contract, which the check of the targets
      # of Anagraphe verifies.
      properties:
        from: {x-target-contract: ['onomasia:glossary']}
  metadata: {type: object, description: Fields of the consumer, which Onomasia does not read.}
  terms:
    type: object
    propertyNames: {$ref: 'common.schema.yml#/$defs/id'}
    additionalProperties: {$ref: '#/$defs/term'}
  rules:
    type: object
    propertyNames: {$ref: 'common.schema.yml#/$defs/id'}
    additionalProperties: {$ref: '#/$defs/rule'}
examples:
  - _schema: 'onomasia:glossary@2'
    id: project
    imports:
      - {from: {repository: lexicon, id: base}, except: [curve]}
      - {from: local-base, as: b}
    terms:
      manifold: {label: manifold, gloss: a smooth set, relations: {narrows: [b.curve]}}

$defs:
  term:
    type: object
    additionalProperties: false
    required: [label, gloss]
    properties:
      label: {$ref: 'common.schema.yml#/$defs/text'}
      gloss: {$ref: 'common.schema.yml#/$defs/text'}
      forms:
        type: array
        items: {$ref: 'common.schema.yml#/$defs/form'}
      source: {$ref: 'common.schema.yml#/$defs/text'}
      status: {$ref: 'common.schema.yml#/$defs/status'}
      superseded_by: {$ref: 'common.schema.yml#/$defs/ref'}
      case_sensitive: {type: boolean}
      frames:
        type: array
        items: {type: string, pattern: '~'}
      alternatives:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [label, when]
          properties:
            label: {$ref: 'common.schema.yml#/$defs/text'}
            when: {$ref: 'common.schema.yml#/$defs/contexts'}
      relations:
        type: object
        additionalProperties:
          type: array
          uniqueItems: true
          items: {$ref: 'common.schema.yml#/$defs/ref'}
      metadata: {type: object}
  rule:
    type: object
    additionalProperties: false
    required: [forms, replace_with, reason]
    properties:
      forms:
        type: array
        minItems: 1
        items: {$ref: 'common.schema.yml#/$defs/form'}
      replace_with:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          oneOf:
            - required: [term]
            - required: [instruction]
          properties:
            term: {$ref: 'common.schema.yml#/$defs/ref'}
            instruction: {$ref: 'common.schema.yml#/$defs/text'}
            when: {$ref: 'common.schema.yml#/$defs/contexts'}
            condition:
              $ref: 'common.schema.yml#/$defs/text'
              description: Sense of the forbidden form that the replacement serves.
      reason: {$ref: 'common.schema.yml#/$defs/text'}
      severity: {enum: [error, warning]}
      status: {$ref: 'common.schema.yml#/$defs/status'}
      audiences:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: 'common.schema.yml#/$defs/id'}
      exceptions:
        type: array
        items: {$ref: 'common.schema.yml#/$defs/form'}
      case_sensitive: {type: boolean}
      metadata: {type: object, description: Fields of the consumer, which Onomasia does not read.}
