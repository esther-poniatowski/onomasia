# Definitions shared by the formats of Onomasia, written as JSON Schema (draft 2020-12) in YAML.
# The schemas fix the structure of a record; the value sets of a consumer, such as its statuses
# and its contexts, are checked against its vocabulary instead.
$schema: https://json-schema.org/draft/2020-12/schema
$id: common.schema.yml
title: Common definitions of Onomasia

$defs:
  id:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    description: A stable kebab-case key, so that renaming a label leaves every reference valid.
  ref:
    type: string
    pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)?[a-z0-9]+(-[a-z0-9]+)*$'
    description: Identifier of an entry, prefixed by the alias of a namespaced import when it lies there.
  text:
    type: string
    minLength: 1
  status:
    type: string
    minLength: 1
    description: Status of the entry, among the statuses of the vocabulary of the consumer.
  form:
    description: >-
      A written form of a record, literal at word boundaries or a regular expression of Python,
      written as an object to state what it stands for.
    oneOf:
      - {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [literal]
        properties:
          literal: {type: string, minLength: 1}
          description: {$ref: '#/$defs/text'}
      - type: object
        additionalProperties: false
        required: [regex]
        properties:
          regex: {type: string, minLength: 1}
          description: {$ref: '#/$defs/text'}
  normal-form:
    description: A written form of a document, a literal string or a regular expression.
    oneOf:
      - {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [regex]
        properties:
          regex: {type: string, minLength: 1}
  contexts:
    type: object
    description: Values of each context dimension of the vocabulary that the item suits.
    additionalProperties:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
  import:
    type: object
    additionalProperties: false
    required: [from]
    allOf:
      - not: {required: [only, except]}
      - not: {required: [as, only]}
      - not: {required: [as, except]}
    properties:
      from: {$ref: '#/$defs/id'}
      as: {$ref: '#/$defs/id'}
      only:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
      except:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
  imports:
    type: array
    items: {$ref: '#/$defs/import'}
  class:
    type: object
    additionalProperties: false
    properties:
      template: {$ref: '#/$defs/text'}
      gloss: {$ref: '#/$defs/text'}
  sources:
    type: array
    description: Repositories of the records behind a generated document, each with its commit.
    items:
      type: object
      additionalProperties: false
      required: [repository, commit, dirty]
      properties:
        repository: {type: string, minLength: 1}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        dirty: {type: boolean}
