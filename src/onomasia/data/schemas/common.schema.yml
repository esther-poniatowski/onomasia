# Definitions shared by the formats of Onomasia, written as JSON Schema (draft 2020-12) in YAML.
# The schemas fix the structure of a record; the value sets of a consumer, such as its statuses
# and its contexts, are checked against its vocabulary instead.
$schema: https://json-schema.org/draft/2020-12/schema
$id: common.schema.yml
title: Common definitions of Onomasia

$defs:
  id:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    description: A stable kebab-case key, so that renaming a label leaves every reference valid.
  ref:
    type: string
    pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)?[a-z0-9]+(-[a-z0-9]+)*$'
    description: Identifier of an entry, prefixed by the alias of a namespaced import when it lies there.
  text:
    type: string
    minLength: 1
  status:
    type: string
    minLength: 1
    description: Status of the entry, among the statuses of the vocabulary of the consumer.
  form:
    description: >-
      A written form of a record, literal at word boundaries or a regular expression of Python,
      written as an object to state what it stands for.
    oneOf:
      - {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [literal]
        properties:
          literal: {type: string, minLength: 1}
          description: {$ref: '#/$defs/text'}
      - type: object
        additionalProperties: false
        required: [regex]
        properties:
          regex: {type: string, minLength: 1}
          description: {$ref: '#/$defs/text'}
  normal-form:
    description: A written form of a document, a literal string or a regular expression.
    oneOf:
      - {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [regex]
        properties:
          regex: {type: string, minLength: 1}
  contexts:
    type: object
    description: Values of each context dimension of the vocabulary that the item suits.
    additionalProperties:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
  import:
    type: object
    additionalProperties: false
    required: [from]
    allOf:
      - not: {required: [only, except]}
      - not: {required: [as, only]}
      - not: {required: [as, except]}
    properties:
      from: {$ref: '#/$defs/id'}
      as: {$ref: '#/$defs/id'}
      only:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
      except:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
  imports:
    type: array
    items: {$ref: '#/$defs/import'}
  import-source:
    description: >-
      The record named by the source of an import, or by the notation of an overlay: an
      identifier, naming a record of the repository holding the naming record, or a logical target
      of Anagraphe, naming a record of any repository. A target without repository names the
      repository holding the naming record.
    oneOf:
      - {$ref: '#/$defs/id'}
      - $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target'
        required: [id]
        not: {required: [unit]}
  import-v2:
    description: >-
      An import of the contracts onomasia:glossary@2 and onomasia:notation@2, whose source is an
      identifier or a logical target. The schema of each contract adds the x-target-contract of its
      own records at the key from.
    type: object
    additionalProperties: false
    required: [from]
    allOf:
      - not: {required: [only, except]}
      - not: {required: [as, only]}
      - not: {required: [as, except]}
    properties:
      from: {$ref: '#/$defs/import-source'}
      as: {$ref: '#/$defs/id'}
      only:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
      except:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
  unit-target:
    description: >-
      A normalized logical target of a unit: its repository, its record and its unit, as every
      output of Onomasia writes it.
    $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target'
    required: [repository, id, unit]
  inputs:
    type: array
    description: >-
      Records of other repositories imported into the records behind a generated document, each
      with the sha256 digest of its bytes, ordered by repository, then commit, then identifier.
    items:
      type: object
      additionalProperties: false
      required: [repository, commit, id, sha256]
      properties:
        repository:
          $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/repository-id'
        commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
        id:
          $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/record-id'
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  class:
    type: object
    additionalProperties: false
    properties:
      template: {$ref: '#/$defs/text'}
      gloss: {$ref: '#/$defs/text'}
  sources:
    type: array
    description: >-
      Repository holding the files read to generate a document, at the commit checked out; empty
      when the producer runs in no Git repository. The cases of specs/cases/sources.yml fix the
      meaning of each field.
    items:
      type: object
      additionalProperties: false
      required: [repository, commit, dirty]
      properties:
        repository:
          description: Location of the repository, without the user information of its remote.
          type: string
          minLength: 1
        commit:
          description: Full identifier of the commit checked out.
          type: string
          pattern: '^[0-9a-f]{40}$'
        dirty:
          description: >-
            True when the commit does not hold one of the files read to generate the document:
            the file differs from its committed state, is untracked or ignored, or lies outside
            the repository. A change to any other file, the document itself included, leaves it
            false.
          type: boolean
