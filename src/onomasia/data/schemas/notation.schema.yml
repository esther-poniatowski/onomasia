# Format of a notation, onomasia:notation@2: the symbols of a vocabulary, each naming the unit that
# it denotes by a logical target, and the typographic classes whose templates print them. An import
# names its source by an identifier, or by a logical target into another repository. The file
# notation.v1.schema.yml keeps onomasia:notation@1, which Onomasia still reads.
$schema: https://json-schema.org/draft/2020-12/schema
$id: notation.schema.yml
title: Notation
type: object
additionalProperties: false
# The identifier of the record, which a logical target of Anagraphe names.
x-identifier: id
required: [_schema, id]
properties:
  _schema: {const: 'onomasia:notation@2'}
  id: {$ref: 'common.schema.yml#/$defs/id'}
  imports:
    type: array
    items:
      $ref: 'common.schema.yml#/$defs/import-v2'
      # The record named by a target follows a notation contract, which the check of the targets
      # of Anagraphe verifies.
      properties:
        from: {x-target-contract: ['onomasia:notation']}
  metadata: {type: object, description: Fields of the consumer, which Onomasia does not read.}
  classes:
    type: object
    propertyNames: {$ref: 'common.schema.yml#/$defs/id'}
    additionalProperties: {$ref: 'common.schema.yml#/$defs/class'}
  entries:
    type: object
    propertyNames: {$ref: 'common.schema.yml#/$defs/id'}
    additionalProperties: {$ref: '#/$defs/entry'}
examples:
  - _schema: 'onomasia:notation@2'
    id: mixture
    imports:
      - {from: {repository: lexicon, id: base-notation}}
    classes:
      matrix: {template: '\boldsymbol{{{base}}}'}
    entries:
      w-ff: {denotes: {id: mixture-model, unit: weights}, base: W, class: matrix}
      lam: {gloss: a free parameter, body: '\lambda'}

$defs:
  entry:
    type: object
    additionalProperties: false
    properties:
      denotes:
        $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target'
        required: [id, unit]
        description: >-
          Logical target of the unit that the entry designates; a target without repository names
          a unit of the repository holding the notation.
      gloss: {$ref: 'common.schema.yml#/$defs/text'}
      body: {$ref: 'common.schema.yml#/$defs/text'}
      base: {$ref: 'common.schema.yml#/$defs/text'}
      class: {$ref: 'common.schema.yml#/$defs/ref'}
      name:
        type: string
        pattern: '^[A-Za-z]+$'
        description: Macro name, a TeX control word.
      entry: {type: boolean, description: Whether the macro takes the optional entry argument.}
      separator: {$ref: 'common.schema.yml#/$defs/text'}
      status: {$ref: 'common.schema.yml#/$defs/status'}
      superseded_by: {$ref: 'common.schema.yml#/$defs/ref'}
      overloads:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: 'common.schema.yml#/$defs/id'}
        description: Entries of the composed notation printing the same body on purpose.
      alternatives:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [body, when]
          properties:
            body: {$ref: 'common.schema.yml#/$defs/text'}
            when: {$ref: 'common.schema.yml#/$defs/contexts'}
      metadata: {type: object, description: Fields of the consumer, which Onomasia does not read.}
