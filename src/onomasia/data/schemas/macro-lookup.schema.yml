# Contract onomasia:macro-lookup@2: the macro name to write for each unit, built from base
# notations, whose names every overlay keeps. Each item pairs the normalized logical target of a
# unit with its name, ordered by the repository, the identifier and the unit of the target, so a
# reader builds its own map by comparing normalized targets. Onomasia generates it; views read it.
$schema: https://json-schema.org/draft/2020-12/schema
$id: macro-lookup.schema.yml
title: Macro lookup
type: object
additionalProperties: false
required: [contract, sources, notations, targets]
properties:
  contract: {const: 'onomasia:macro-lookup@2'}
  sources: {$ref: 'common.schema.yml#/$defs/sources'}
  inputs: {$ref: 'common.schema.yml#/$defs/inputs'}
  notations: {type: array, items: {$ref: 'common.schema.yml#/$defs/id'}}
  targets:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [target, name]
      properties:
        target: {$ref: 'common.schema.yml#/$defs/unit-target'}
        name: {type: string, pattern: '^[A-Za-z]+$'}
examples:
  - contract: 'onomasia:macro-lookup@2'
    sources: []
    notations: [mixture]
    targets:
      - {target: {repository: mixture, id: mixture-model, unit: set}, name: onosetOf}
      - {target: {repository: mixture, id: mixture-model, unit: sum}, name: onosumOp}
