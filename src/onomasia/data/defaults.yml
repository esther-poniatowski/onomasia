# Catalog of the checks of Onomasia, with the default severity of each, and the default
# vocabularies. A consumer overrides a severity, or sets it to off, and replaces a vocabulary, in
# its own onomasia.yml; it cannot name a check absent from this catalog.

checks:
  invalid-yaml:
    severity: error
    gloss: the record does not parse as YAML
  duplicate-key:
    severity: error
    gloss: a mapping repeats a key, whose earlier value the parser would drop
  unknown-format:
    severity: error
    gloss: the record names no format of Onomasia under its key _schema
  wrong-format:
    severity: error
    gloss: the record matches the paths of one format and declares another
  schema-violation:
    severity: error
    gloss: the record breaks the schema of its format
  duplicate-record:
    severity: error
    gloss: two records of one format share an identifier
  unresolved-import:
    severity: error
    gloss: an import names no record of the format of the importing record
  import-cycle:
    severity: error
    gloss: the imports of a record lead back to it
  unresolved-import-entry:
    severity: error
    gloss: an import selects or excludes an entry absent from its source
  import-conflict:
    severity: error
    gloss: two merged sources supply one identifier with different entries
  duplicate-alias:
    severity: error
    gloss: two imports of one record bind the same alias
  duplicate-entry:
    severity: error
    gloss: two sections of one record declare the same identifier
  unresolved-reference:
    severity: error
    gloss: a reference names no entry visible from its record
  unknown-status:
    severity: error
    gloss: a status is absent from the vocabulary of statuses
  missing-replacement:
    severity: error
    gloss: an entry of a status requiring a replacement names none
  unknown-context:
    severity: error
    gloss: a context names a dimension or a value absent from the vocabulary of contexts
  unknown-relation:
    severity: error
    gloss: a relation of a term is absent from the vocabulary of relations
  form-collision:
    severity: error
    gloss: two terms of one composed glossary share a written form
  rule-shadows-term:
    severity: error
    gloss: a lexical rule forbids a written form of a term of the same composed glossary
  missing-body:
    severity: error
    gloss: a notation entry gives neither a body nor a base under a class with a template
  ambiguous-body:
    severity: error
    gloss: a notation entry gives both a body and a base
  body-collision:
    severity: error
    gloss: two entries of one composed notation print the same body, and neither declares the other under overloads
  unneeded-overload:
    severity: warning
    gloss: an entry declares an overload with itself, or with an entry printing another body
  undeclared-entry:
    severity: warning
    gloss: a notation entry denotes no unit, and its gloss stands for the meaning
  missing-gloss:
    severity: error
    gloss: a notation entry denotes no unit and carries no gloss
  gloss-with-target:
    severity: error
    gloss: a notation entry denotes a unit and also carries a gloss, which the unit states
  unresolved-overlay:
    severity: error
    gloss: an overlay names no notation to overlay
  unknown-override:
    severity: error
    gloss: an overlay overrides an entry or a class absent from the notation it overlays
  template-without-placeholder:
    severity: error
    gloss: the template of a typographic class omits the placeholder of the base
  reserved-prefix:
    severity: error
    gloss: a declared macro name starts with the prefix reserved for derived names
  macro-name-collision:
    severity: error
    gloss: two entries of one macro table bear the same macro name
  ambiguous-target:
    severity: error
    gloss: two entries of one macro table denote the same unit, so a view cannot choose a name
  too-many-parameters:
    severity: error
    gloss: a macro takes more parameters than TeX admits
  missing-separator:
    severity: error
    gloss: an entry denoting a variadic operator declares no separator of its items
  macro-cycle:
    severity: error
    gloss: the bodies of macros call one another in a cycle, so their expansion never ends
  invalid-contract:
    severity: error
    gloss: an input document breaks the schema of its contract or names another contract
  unresolved-output:
    severity: error
    gloss: an output of the build names a notation, an overlay or a glossary that no record holds
  invalid-form:
    severity: error
    gloss: a written form given as a regular expression does not compile, names a group, holds a backreference, or matches the empty string
  invalid-frame:
    severity: error
    gloss: a frame holds no or several term marks, an unbalanced bracket or brace, a mark inside an optional part, or a slot naming an empty term or no term
  forbidden-form:
    severity: error
    gloss: a text writes a form forbidden by a lexical rule that binds it, outside the exceptions of the rule
  frame-mismatch:
    severity: warning
    gloss: a text writes a term outside every frame admitted for it
  term-status:
    severity: error
    gloss: a text writes a term whose status reports its use in texts
  entry-status:
    severity: error
    gloss: a text calls the macro of a notation entry whose status reports its use in texts
  unknown-macro:
    severity: error
    gloss: a text calls a macro under the reserved prefix that its bound notations do not define
  raw-printed-form:
    severity: warning
    gloss: a text writes the printed body of a notation entry instead of calling its macro
  unresolved-text-binding:
    severity: error
    gloss: a binding of a text names a glossary or a notation that no record holds
  unreadable-text:
    severity: error
    gloss: a text cannot be read as UTF-8

# Vocabularies read by the checks, replaced as a whole by the vocabularies of a consumer.
vocabulary:
  # Each status may require a replacement, named by the key replaced_by of its entry.
  # Each status may also state, under in_texts, the severity of a use of a term or an entry of the
  # status in a text (term, off by default), and the highest severity of a rule of the status
  # (rule, error by default).
  statuses:
    candidate: {requires_replacement: false, in_texts: {term: warning, rule: warning}}
    in-use: {requires_replacement: false}
    ratified: {requires_replacement: false}
    deprecated: {requires_replacement: true, in_texts: {term: error, rule: "off"}}
  # Status of an entry that declares none.
  default_status: in-use
  # Dimensions of the contexts that an alternative suits, each with its admitted values.
  contexts: {}
  # Relations that a term may hold to other terms.
  relations: [narrows, broadens]

# Typography read by the checks of notations and by the macro table.
typography:
  # Placeholder standing for the base of an entry in the template of its class. It differs from
  # every TeX construct, since # opens the parameters of a macro.
  base_placeholder: "{{base}}"
  # Prefix of the macro name derived for an entry without a declared name, which no declared name
  # may start with, so that a derived name never overwrites a command of TeX.
  macro_prefix: ono
  # Words replacing the digits of an identifier in a derived name, since a control word of TeX
  # holds letters only.
  digit_names: [Zero, One, Two, Three, Four, Five, Six, Seven, Eight, Nine]
  # Parameters of one macro, as TeX admits them.
  maximum_parameters: 9

# Reading of the texts, for the keys that the section texts of a consumer leaves out.
texts:
  # Kinds of Merismos masked before prose is matched: what is not prose. The destination of a
  # wikilink without an alias stays prose, since the link displays it.
  masked: [frontmatter, fenced-code, indented-code, inline-code, display-math, inline-math, link-destination]
  # Kinds of Merismos holding the mathematics checked against the notations.
  math: [inline-math, display-math]
  # Words admitted, one at most, before the slot of a frame.
  determiners: [the, a, an, this, that, these, those, each, every, its, their]
