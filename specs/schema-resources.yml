# Inputs of the schema closure of onomasia; generated files remain outside this record.
_schema: kleisis:schema-resources@2

paths:
  owned_schemas: src/onomasia/data/schemas

exports:
  - onomasia:glossary@1
  - onomasia:glossary@2
  - onomasia:notation@1
  - onomasia:notation@2
  - onomasia:overlay@1
  - onomasia:overlay@2

dependencies:
  # Anagraphe supplies the addressing primitives that the logical targets of onomasia:glossary@2
  # and onomasia:notation@2 reference by their absolute $id; no contract of Anagraphe is selected.
  # The commit is the release 0.10.0, which environment.yml pins.
  - id: anagraphe
    source:
      kind: git
      repository: https://github.com/esther-poniatowski/anagraphe.git
      commit: d5f7ca15b001b685209da13fc04f1adb2cecfb35
      archive_roots:
        - specs/schema-registry.yml
        - src/anagraphe/data/schemas
    registry: specs/schema-registry.yml
